[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-advisor"
version = "0.1.0"
description = "Compound AI system for stock analysis: deterministic technical/fundamental/valuation engines + news sentiment, aggregated into a scored, LLM-explained recommendation."
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stock_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
